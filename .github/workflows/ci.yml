name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: 3.14.6
      - run: bun install --frozen-lockfile
      - run: bun run schemas
      - run: git diff --exit-code -- schemas/protocol
      - run: test -z "$(git ls-files --others --exclude-standard -- schemas/protocol)"
      - run: bun run verify
      - run: docker pull alpine@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce
      - run: bun test tests/container-runtime.integration.test.ts
        env:
          EXGEN_CONTAINER_INTEGRATION: "1"
      - run: bun run site:validate
      - run: bun run smoke
        env:
          EXGEN_SMOKE_OUTPUT: ${{ runner.temp }}/exgen-smoke
      - run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-validation.txt
      - run: cffconvert --validate
      - run: mlcroissant validate --jsonld "${RUNNER_TEMP}/exgen-smoke/release/metadata/croissant.json"
      - run: rocrate-validator validate --profile-identifier ro-crate-1.2 "${RUNNER_TEMP}/exgen-smoke/release"
      - name: Validate a real restricted archive with bagit-python
        run: |
          bun run src/cli.ts run examples/smoke/benchmark.yaml --id bagit-conformance
          bun run src/cli.ts archive create .exgen/runs/bagit-conformance \
            --output "${RUNNER_TEMP}/exgen-bagit" \
            --id bagit-conformance \
            --retention-until 2099-12-31 \
            --content metadata-only
          bun run src/cli.ts archive verify "${RUNNER_TEMP}/exgen-bagit"
          python -m bagit --validate "${RUNNER_TEMP}/exgen-bagit"

  server:
    name: Survey server
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tools/tier3-expert-rating/server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      # Formatting, and the tests against PostgreSQL in Testcontainers, including the simulation that
      # must reproduce analysis/example/data.json.
      - run: ./gradlew check

  survey:
    name: Survey analysis and server image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      # Regenerates the example report from the simulated export in the pinned R container.
      - run: bun run survey:example --check
      - run: docker build --file tools/tier3-expert-rating/deploy/Dockerfile --tag ghcr.io/ls1intum/exgen-bench/survey:ci .
      - name: Run the deployment's compose file with the image and a frozen study
        working-directory: tools/tier3-expert-rating/deploy
        env:
          IMAGE_TAG: ci
          SURVEY_HOST: survey.localhost
          POSTGRES_PASSWORD: ci-only-password
          SURVEY_LEGAL_IMPRINT: https://example.org/imprint
          SURVEY_LEGAL_PRIVACY: /legal/privacy.example.md
          STUDY_DIRECTORY: ../server/src/test/resources/study
        run: |
          docker network create traefik
          docker compose up --detach --wait --wait-timeout 180
          docker compose exec survey survey link --admin --rater R1
          docker compose exec survey wget --quiet --output-document=- http://127.0.0.1:8080/api/site
          docker compose down --volumes

  survey-browser:
    name: Survey browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium firefox webkit
      - run: bun run survey:browser-test
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: survey-browser-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
      options: --ipc=host --user 1001
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: xargs -I{} npx --yes bun@{} install --frozen-lockfile < .bun-version
      - run: xargs -I{} npx --yes bun@{} run browser:test < .bun-version
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
