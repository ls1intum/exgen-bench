name: Bug report
description: Report a reproducible problem in exgen-bench.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues before reporting a problem. Do not include credentials, private exercise content, or model responses that cannot be shared publicly.
  - type: dropdown
    id: surface
    attributes:
      label: Affected area
      options:
        - CLI or experiment runner
        - Adapter or protocol
        - Evaluator or analysis
        - Release data or results site
        - Documentation
        - Unsure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Release, commit, or branch where the problem occurs.
      placeholder: main at COMMIT_SHA
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Include the smallest configuration and commands needed to reproduce the problem.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: If relevant, include the operating system, architecture, Bun version, and container runtime.
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Add relevant output after removing credentials and private data.
      render: text
  - type: checkboxes
    id: safety
    attributes:
      label: Data safety
      options:
        - label: I removed credentials, private exercise content, and other sensitive data.
          required: true
