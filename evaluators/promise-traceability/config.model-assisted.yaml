# Adds the EXPLORATORY model-assisted layer on top of the deterministic one. Every metric this
# layer produces is unvalidated, depends on a model and prompt the suite digest does not pin, and
# must never be reported as a headline number. Point --base-url at an OpenAI-compatible endpoint
# and export PROMISE_TRACEABILITY_API_KEY before running.
schema_version: "1"
evaluator:
  id: promise-traceability
  version: "1"
  revision: source-tree-model-assisted
  target_profile: artemis-java-maven
  implementation_digest: 49230fc60f9140b1382a6ce9ac702a0dd731f09f5c435269d1fa8e0ba3d7c10a
suite:
  id: promise-traceability-study
  version: "1"
  digest: 87ad8120a28d4ff17566838f5b37890f0b4f08e1c3abbc86456148b739bb139f
requested_metrics:
  - promise.witnessed_ratio
  - promise.unwitnessed_claims
  - promise.unclassified_normative_units
  - api.member_reference_ratio
  - exception.assertthrows_ratio
  - boundary.literal_ratio
  - tests.behavioural_methods
  - tests.assertions
  - tests.assertion_density
  - tests.assertionless_methods
  - tests.structural_lane_present
  - promise.model_claims
  - promise.model_unwitnessed_claims
  - promise.model_witnessed_ratio
process:
  argv:
    - "{bun}"
    - "run"
    - "worker.ts"
    - "--model"
    - "REPLACE_WITH_MODEL_ID"
    - "--base-url"
    - "https://REPLACE_WITH_PROVIDER/v1"
  cwd: "."
  env:
    PROMISE_TRACEABILITY_API_KEY: PROMISE_TRACEABILITY_API_KEY
execution:
  timeout_ms: 300000
  concurrency: 2
  maximum_input_bytes: 1048576
  maximum_response_bytes: 16777216
  maximum_log_bytes: 1048576
  termination_grace_ms: 2000
