schema_version: "1"
backend:
  kind: maven
  local_repository: ../../.exgen/maven-repository
  build_timeout_ms: 900000
  # One JDK per Java release the corpus declares, so each artifact builds under the toolchain it
  # asks for rather than whatever JAVA_HOME the operator exported. These are host paths for the
  # platform this profile targets; a host that installs its JDKs elsewhere overrides them, which
  # re-pins the configuration digest and so changes the evaluator's identity rather than silently
  # changing which JDK produced a figure.
  java_homes:
    "17": /usr/lib/jvm/java-17-openjdk-amd64
    "21": /usr/lib/jvm/java-21-openjdk-amd64
    "25": /usr/lib/jvm/java-25-openjdk-amd64
