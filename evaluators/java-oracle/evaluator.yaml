# `exgen evaluate process` configuration for the java-oracle evaluator.
#
# implementation_digest and suite.digest are the SHA-256 digests of worker.ts and SUITE.md.
# Regenerate with: sha256sum evaluators/java-oracle/worker.ts evaluators/java-oracle/SUITE.md
# tests/evaluator-configs.test.ts fails if either drifts.
#
# argv names config.localci.yaml, which is not in the repository: copy config.localci.example.yaml
# and fill in the deployment. Until you do, this evaluator fails with a missing-configuration error,
# which is the honest outcome — the alternative was a fixture-backed default that replayed
# recordings, measured nothing, and still exited successfully.
#
# The digest covers argv, so a new path is a new evaluator identity; editing a backend configuration
# in place instead would change what is measured without changing the digest.
schema_version: "1"
evaluator:
  id: java-oracle
  version: "1"
  revision: source-tree
  target_profile: artemis-java-maven
  implementation_digest: 88fd03651074aa10dc1fbbe09dbec80548a98633d450649b16460154d4d6c796
suite:
  id: java-oracle-development
  version: "1"
  digest: bc644b283b1a58d5af9f9af6f17d0646c7fd21ea46d53645f70955a2f2282018
requested_metrics:
  - build.template_compiles
  - build.solution_compiles
  - tests.executable
  - tests.count
  - oracle.solution_pass_rate
  - oracle.template_pass_rate
  - oracle.satisfied
  - coverage.statement
  - coverage.branch
  - mutation.score
process:
  argv: ["{bun}", "run", "worker.ts", "--config", "config.localci.yaml"]
  cwd: "."
  env: {}
execution:
  timeout_ms: 1800000
  concurrency: 2
  maximum_input_bytes: 1048576
  maximum_response_bytes: 16777216
  maximum_log_bytes: 1048576
  termination_grace_ms: 10000
