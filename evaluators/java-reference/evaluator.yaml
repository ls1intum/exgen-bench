# `exgen evaluate process` configuration for the java-reference evaluator.
#
# Regenerate implementation_digest with:
# bun run evaluators/shared/identity.ts evaluators/java-reference
# suite is copied from the metric-neutral reference-set manifest used below.
#
schema_version: "1"
evaluator:
  id: java-reference
  version: "1"
  revision: source-tree
  target_profile: artemis-java-maven
  implementation_digest: 87075614d4952e9aedb6dc158490924cccb1a5095c38893518d397e31ce4baac
suite:
  id: java-reference-development
  version: "1"
  digest: 1b775b7a100442ee786aa51c51592fbe2f634af0fe2ed2532aafa358e2bb0550
requested_metrics:
  - reference.codebleu
  - reference.ast_edit_distance
  - reference.golden_tests_on_generated_pass_rate
  - reference.generated_tests_on_golden_pass_rate
  - reference.statement_embedding_similarity
process:
  argv: ["{bun}", "run", "worker.ts", "--references", "../fixtures/suite/reference-set.yaml"]
  cwd: "."
  env: {}
execution:
  timeout_ms: 300000
  concurrency: 4
  maximum_input_bytes: 1048576
  maximum_response_bytes: 16777216
  maximum_log_bytes: 1048576
  termination_grace_ms: 5000
