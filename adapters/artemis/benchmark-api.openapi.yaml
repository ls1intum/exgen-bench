openapi: 3.1.0
info:
  title: Artemis Hyperion Benchmark API
  version: 1.0.0
  description: |
    Proposed durable, export-only API shared by the exgen-bench Artemis generator
    and canonical verifier adapters. This is a co-design contract, not an API
    currently available on Artemis develop.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: https://artemis.example.invalid
security:
  - bearerAuth: []
tags:
  - name: Generation
  - name: Verification
paths:
  /api/hyperion/generation/capabilities:
    get:
      tags: [Generation]
      operationId: getGenerationCapabilities
      responses:
        "200":
          description: Exact benchmark capability contract.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerationCapabilities"
  /api/hyperion/generation/runs:
    post:
      tags: [Generation]
      operationId: startGenerationRun
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerationStart"
      responses:
        "200":
          description: Existing run for the same idempotency key and identical request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunReference"
        "201":
          description: Newly durably admitted run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunReference"
        "202":
          description: Newly durably admitted run whose execution continues asynchronously.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunReference"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
  /api/hyperion/generation/runs/by-client-attempt/{clientAttemptId}:
    x-optional-extension: true
    get:
      tags: [Generation]
      operationId: reconcileGenerationRun
      parameters:
        - $ref: "#/components/parameters/ClientAttemptId"
      responses:
        "200":
          description: Durable run admitted for this benchmark observation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunReference"
        "404":
          description: No run was durably admitted.
  /api/hyperion/generation/runs/{runId}:
    get:
      tags: [Generation]
      operationId: getGenerationRun
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Current durable state and effective provenance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerationRun"
  /api/hyperion/generation/runs/{runId}/events:
    get:
      tags: [Generation]
      operationId: getGenerationEvents
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/AfterSequence"
      responses:
        "200":
          description: Strictly ordered events after the supplied sequence.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventPage"
  /api/hyperion/generation/runs/{runId}/bundle:
    get:
      tags: [Generation]
      operationId: getGenerationBundle
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Immutable export-only candidate and capture metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerationBundle"
  /api/hyperion/generation/runs/{runId}/cancel:
    post:
      tags: [Generation]
      operationId: cancelGenerationRun
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "202":
          description: Cancellation was durably requested.
        "204":
          description: Run was already terminal.
  /api/hyperion/verification/capabilities:
    get:
      tags: [Verification]
      operationId: getVerificationCapabilities
      responses:
        "200":
          description: Exact canonical-verifier capability contract.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationCapabilities"
  /api/hyperion/verification/runs:
    post:
      tags: [Verification]
      operationId: startVerificationRun
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerificationStart"
      responses:
        "200":
          description: Existing run for the same idempotency key and identical request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunReference"
        "201":
          description: Newly durably admitted verification.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunReference"
        "202":
          description: Newly durably admitted verification whose execution continues asynchronously.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunReference"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
  /api/hyperion/verification/runs/{runId}:
    get:
      tags: [Verification]
      operationId: getVerificationRun
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Current durable state and benchmark observation identity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationRun"
  /api/hyperion/verification/runs/{runId}/events:
    get:
      tags: [Verification]
      operationId: getVerificationEvents
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/AfterSequence"
      responses:
        "200":
          description: Strictly ordered events after the supplied sequence.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventPage"
  /api/hyperion/verification/runs/{runId}/evidence:
    get:
      tags: [Verification]
      operationId: getVerificationEvidence
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Structured report with exact identity echo and environment provenance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationEvidence"
  /api/hyperion/verification/runs/{runId}/cancel:
    post:
      tags: [Verification]
      operationId: cancelVerificationRun
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "202":
          description: Cancellation was durably requested.
        "204":
          description: Run was already terminal.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 256
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    ClientAttemptId:
      name: clientAttemptId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    AfterSequence:
      name: after
      in: query
      required: true
      schema:
        type: integer
        minimum: 0
        default: 0
  responses:
    IdempotencyConflict:
      description: The idempotency key was already used with a different canonical request.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Digest:
      type: string
      pattern: "^[a-f0-9]{64}$"
    Sha256Digest:
      type: string
      pattern: "^sha256:[a-f0-9]{64}$"
    RunReference:
      type: object
      additionalProperties: false
      required: [runId]
      properties:
        runId:
          type: string
          minLength: 1
    Problem:
      type: object
      additionalProperties: true
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
    Target:
      type: object
      additionalProperties: false
      required: [id, version, revision, parameters]
      properties:
        id:
          type: string
        version:
          type: string
        revision:
          type: string
        parameters:
          type: object
          additionalProperties: true
    ResourceBudget:
      type: object
      additionalProperties: true
      required: [wall_time_ms]
      properties:
        wall_time_ms:
          type: integer
          minimum: 1
        max_output_bytes:
          type: integer
          minimum: 1
        max_model_calls:
          type: integer
          minimum: 1
        max_tool_calls:
          type: integer
          minimum: 1
        max_input_tokens:
          type: integer
          minimum: 1
        max_output_tokens:
          type: integer
          minimum: 1
        max_total_tokens:
          type: integer
          minimum: 1
        max_cost:
          type: object
          additionalProperties: false
          required: [amount, currency]
          properties:
            amount:
              type: number
              exclusiveMinimum: 0
            currency:
              type: string
              minLength: 3
              maxLength: 3
    GenerationCapabilities:
      type: object
      additionalProperties: true
      required:
        - protocol_version
        - durable_runs
        - idempotent_start
        - artifact_bundle
        - sequenced_events
        - cancellation
      properties:
        protocol_version:
          const: "1"
        durable_runs:
          const: true
        idempotent_start:
          const: true
        artifact_bundle:
          const: true
        sequenced_events:
          const: true
        cancellation:
          const: true
        artemis_revision:
          type: string
        registered_approaches:
          type: array
          items:
            $ref: "#/components/schemas/ApproachDescriptor"
    VerificationCapabilities:
      type: object
      additionalProperties: true
      required:
        - protocol_version
        - durable_runs
        - canonical_candidate_verifier
        - idempotent_start
        - sequenced_events
        - cancellation
      properties:
        protocol_version:
          const: "1"
        durable_runs:
          const: true
        canonical_candidate_verifier:
          const: true
        idempotent_start:
          const: true
        sequenced_events:
          const: true
        cancellation:
          const: true
        verifier_profiles:
          type: array
          items:
            type: string
    ApproachDescriptor:
      type: object
      additionalProperties: true
      required: [id, version, implementation_digest]
      properties:
        id:
          type: string
        version:
          type: string
        implementation_digest:
          $ref: "#/components/schemas/Sha256Digest"
        factors:
          type: object
          additionalProperties: true
    GenerationStart:
      type: object
      additionalProperties: false
      required:
        - protocol_version
        - client_attempt_id
        - input
        - target
        - approach
        - seed
        - budget
        - extensions
      properties:
        protocol_version:
          const: "1"
        client_attempt_id:
          type: string
        input:
          type: object
          additionalProperties: false
          required: [id, title, brief, tags]
          properties:
            id:
              type: string
            title:
              type: string
            brief:
              type: string
            tags:
              type: array
              items:
                type: string
        target:
          $ref: "#/components/schemas/Target"
        approach:
          type: object
          additionalProperties: false
          required: [id, version]
          properties:
            id:
              type: string
            version:
              type: string
        model_profile:
          type: string
        scaffold_ref:
          type: string
        seed:
          type: integer
          minimum: 0
          maximum: 4294967295
        budget:
          $ref: "#/components/schemas/ResourceBudget"
        extensions:
          type: object
          additionalProperties: true
    Event:
      type: object
      additionalProperties: true
      required: [sequence, occurred_at, type]
      properties:
        sequence:
          type: integer
          minimum: 1
        occurred_at:
          type: string
          format: date-time
        type:
          type: string
        publishability:
          enum: [public, restricted]
    EventPage:
      type: object
      description: |
        A bounded event page. An empty page means all events after the supplied sequence have
        been returned.
      additionalProperties: false
      required: [events]
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/Event"
    Capture:
      type: object
      additionalProperties: false
      required: [completeness]
      properties:
        completeness:
          enum: [complete, partial, none]
        reason:
          type: string
    Candidate:
      type: object
      additionalProperties: false
      properties:
        problem_statement:
          type: string
        template:
          $ref: "#/components/schemas/TextTree"
        solution:
          $ref: "#/components/schemas/TextTree"
        tests:
          $ref: "#/components/schemas/TextTree"
        metadata:
          type: object
          additionalProperties: true
    TextTree:
      type: object
      propertyNames:
        pattern: '^(?!/)(?![A-Za-z]:/)(?!.*\u0000)(?!.*\\)(?!.*(?:^|/)\.{1,2}(?:/|$)).+$'
      additionalProperties:
        type: string
    GenerationRun:
      type: object
      additionalProperties: true
      required: [runId, client_attempt_id, state, approach, provenance, effective_execution]
      properties:
        runId:
          type: string
        client_attempt_id:
          type: string
        state:
          enum:
            - ADMITTED
            - RUNNING
            - SUCCEEDED
            - FAILED
            - ABSTAINED
            - CANCELLED
            - CANCELED
            - TIMED_OUT
            - COMPLETED
        outcome:
          enum: [SUCCEEDED, SUCCESS, FAILED, ABSTAINED]
        bundleAvailable:
          type: boolean
        approach:
          $ref: "#/components/schemas/ApproachDescriptor"
        usage:
          $ref: "#/components/schemas/Usage"
        model:
          $ref: "#/components/schemas/Model"
        cost:
          $ref: "#/components/schemas/Cost"
        telemetry:
          type: object
          additionalProperties: true
        failure:
          type: object
          additionalProperties: true
        provenance:
          $ref: "#/components/schemas/GenerationProvenance"
        effective_execution:
          $ref: "#/components/schemas/EffectiveExecution"
    Model:
      type: object
      additionalProperties: true
      required: [provider, id]
      properties:
        provider:
          type: string
        id:
          type: string
        version:
          type: string
    Usage:
      type: object
      additionalProperties: true
      properties:
        input_tokens:
          type: integer
          minimum: 0
        output_tokens:
          type: integer
          minimum: 0
        reasoning_tokens:
          type: integer
          minimum: 0
        cached_input_tokens:
          type: integer
          minimum: 0
        total_tokens:
          type: integer
          minimum: 0
        model_calls:
          type: integer
          minimum: 0
        tool_calls:
          type: integer
          minimum: 0
    EffectiveExecution:
      type: object
      additionalProperties: false
      required:
        - requested_seed
        - seed_status
        - effective_parameters
        - provider_request_ids
        - provider_request_ids_complete
      properties:
        requested_seed:
          type: integer
          minimum: 0
          maximum: 4294967295
        seed_status:
          enum: [honored, not_honored, unsupported, unverifiable]
        effective_seed:
          type: integer
          minimum: 0
          maximum: 4294967295
        effective_parameters:
          type: object
          description: Provider-confirmed decoding and tool-orchestration parameters.
          additionalProperties: true
        provider_request_ids:
          type: array
          items:
            type: string
        provider_request_ids_complete:
          type: boolean
    Cost:
      type: object
      additionalProperties: false
      required: [amount, currency]
      properties:
        amount:
          type: number
          minimum: 0
        currency:
          type: string
          minLength: 3
          maxLength: 3
    ExecutionEnvironment:
      type: object
      additionalProperties: false
      required: [image_digest, toolchain_digest]
      properties:
        image_digest:
          $ref: "#/components/schemas/Sha256Digest"
        toolchain_digest:
          $ref: "#/components/schemas/Digest"
    GenerationProvenance:
      type: object
      additionalProperties: true
      required: [artemis_revision, prompt_digest, environment]
      properties:
        artemis_revision:
          type: string
          minLength: 1
        prompt_digest:
          $ref: "#/components/schemas/Digest"
        environment:
          $ref: "#/components/schemas/ExecutionEnvironment"
    VerificationProvenance:
      type: object
      additionalProperties: true
      required: [artemis_revision, verifier_revision, environment]
      properties:
        artemis_revision:
          type: string
          minLength: 1
        verifier_revision:
          type: string
          minLength: 1
        environment:
          $ref: "#/components/schemas/ExecutionEnvironment"
    GenerationBundle:
      type: object
      additionalProperties: false
      required: [capture]
      properties:
        capture:
          $ref: "#/components/schemas/Capture"
        candidate:
          $ref: "#/components/schemas/Candidate"
        metadata:
          type: object
          additionalProperties: true
        verification:
          type: object
          additionalProperties: true
    EvaluatorIdentity:
      type: object
      additionalProperties: false
      required: [id, version, revision, target_profile, implementation_digest]
      properties:
        id:
          type: string
        version:
          type: string
        revision:
          type: string
        target_profile:
          type: string
        implementation_digest:
          $ref: "#/components/schemas/Digest"
        configuration_digest:
          $ref: "#/components/schemas/Digest"
        image_digest:
          $ref: "#/components/schemas/Sha256Digest"
    EvaluationSuite:
      type: object
      additionalProperties: false
      required: [id, version, digest]
      properties:
        id:
          type: string
        version:
          type: string
        digest:
          $ref: "#/components/schemas/Digest"
    VerificationStart:
      type: object
      additionalProperties: false
      required:
        - protocol_version
        - client_attempt_id
        - candidate_digest
        - target
        - verifier_profile
        - evaluator
        - suite
        - candidate
      properties:
        protocol_version:
          const: "1"
        client_attempt_id:
          type: string
        candidate_digest:
          $ref: "#/components/schemas/Digest"
        target:
          $ref: "#/components/schemas/Target"
        verifier_profile:
          type: string
        evaluator:
          $ref: "#/components/schemas/EvaluatorIdentity"
        suite:
          $ref: "#/components/schemas/EvaluationSuite"
        candidate:
          allOf:
            - $ref: "#/components/schemas/Candidate"
            - required: [problem_statement, template, solution, tests]
    VerificationRun:
      type: object
      additionalProperties: false
      required: [runId, client_attempt_id, state]
      properties:
        runId:
          type: string
        client_attempt_id:
          type: string
        state:
          enum: [ADMITTED, RUNNING, PASSED, FAILED, ERROR, COMPLETED]
        outcome:
          enum: [PASSED, SUCCESS, FAILED, REJECTED, ERROR]
        result:
          enum: [PASSED, SUCCESS, FAILED, REJECTED, ERROR]
    VerificationEvidence:
      type: object
      additionalProperties: false
      required: [runId, client_attempt_id, candidate_digest, evaluator, suite, report, provenance]
      properties:
        runId:
          type: string
          minLength: 1
        client_attempt_id:
          type: string
          minLength: 1
        candidate_digest:
          $ref: "#/components/schemas/Digest"
        evaluator:
          $ref: "#/components/schemas/EvaluatorIdentity"
        suite:
          $ref: "#/components/schemas/EvaluationSuite"
        report:
          type: object
          additionalProperties: true
        provenance:
          $ref: "#/components/schemas/VerificationProvenance"
