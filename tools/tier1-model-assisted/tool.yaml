schema_version: "1"
id: tier1-model-assisted
tier: 1
title: Tier 1 model-assisted metrics
description: >-
  Narrow, single-question measurements that use a language model as an extraction instrument. Every
  metric is exploratory and unvalidated until checked against blinded expert ratings.
