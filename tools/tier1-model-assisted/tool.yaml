schema_version: "1"
id: tier1-model-assisted
tier: 1
title: Tier 1 model-assisted metrics
description: >-
  Measures the candidate's artifacts with a language model in the loop, so the results are not
  deterministic. Every metric is exploratory and unvalidated.
metric_cards:
  - promise-traceability-model/metric-cards.json
evaluators:
  - id: promise-traceability-model
    config: promise-traceability-model/evaluator.yaml
    template: true
    description: A model extracts the normative claims of the statement and judges whether the tests witness each.
