# The expert rating instrument: every question, option and instruction the survey tool shows.
# This file is the only source of the wording. INSTRUMENT.md is generated from it with
# `bun run survey:instrument`, and CI fails when the two differ.
#
# A rater moves through: consent, the introduction, these background questions, each assigned
# exercise in four parts (a short tour explains the screen on the first one), questions looking back
# on all exercises, and feedback on the briefs. Placeholders in the introduction: {materiality_rule}, and
# {exercise_minutes}, the minutes the four parts budget together.
schema_version: "1"
version: "4"
title: Expert study on generated programming exercises

materiality_rule: >-
  Answer **No** if the problem would plausibly cost an introductory programming student noticeable
  time, lead to a wrong submission, or send them to a tutor. If the issue is cosmetic and does none
  of these, answer **Yes**.

onboarding:
  title: Introduction
  pages:
    - title: Purpose of the study
      body: |
        Thank you for taking part. We study how well an AI pipeline generates programming exercises
        for introductory programming courses.

        Each exercise starts from a **brief** that an instructor wrote: the learning objective, what
        the students already know and what they have not learned yet, and the expected effort. From
        the brief, the pipeline generated a complete exercise: a problem statement, a template that
        students start from, a sample solution, and tests. The tests automatically assess students’ submissions (autograding). Every exercise you see has been checked
        automatically: it compiles, its sample solution passes all its tests, and its template passes
        none of them. We ask you to judge whether the exercise is suitable for teaching.

        Neither you nor the other raters know which model the AI pipeline used for an exercise. Please do not
        discuss the exercises with anyone until we tell you that the study has closed.
    - title: How a rating works
      body: |
        You rate each exercise in four parts, about {exercise_minutes} minutes per exercise. Each part
        adds material, and earlier material stays open:

        | Part | You see | You rate |
        | --- | --- | --- |
        | A | The problem statement and the brief it was generated from | Clarity |
        | B | + the template and the solution changes | Solvability, fit with the brief, scope, scaffolding |
        | C | + the tests and their failure messages | Feedback, readiness |
        | D | + the automatic findings | Automatic findings, readiness again |

        You cannot go back to an earlier part. If later material changes your view, note it under
        *Remarks on earlier answers* in Part D. On your first exercise, a short tour shows you where
        everything is.
    - title: Answering the questions
      body: |
        You answer most questions with Yes or No; a few also offer N/A. When your answer points to a
        problem, a short field asks where it is or why. For borderline cases, the materiality rule
        applies:

        > {materiality_rule}

        | Situation | Question | Answer | Reason |
        | --- | --- | --- | --- |
        | "recieve" is misspelled in the problem statement | CL2 | Yes | A cosmetic issue |
        | The problem statement and the template ask for the average but do not say how to round it, and the sample solution rounds it to two decimal places | SO1 | No | Leads to a wrong submission |
        | The problem statement says "ignore invalid entries" without saying whether an empty name is invalid | CL1 | No | Two reasonable readings |
        | The test `countsOnlyActiveMembers` fails with "expected: <3> but was: <0>" | FB1 | Yes | The test name explains the problem |
        | Several tests are named `test1` to `test5` and have no messages | FB1 | No | The student cannot tell what is wrong |
    - title: Meaning of the readiness levels
      body: |
        Twice per exercise, you rate how much work you would need before you could use it in an
        introductory programming course. These examples serve as anchors:

        | Level | Meaning | Typical example |
        | --- | --- | --- |
        | 5 · Use as is | No change needed | You would give the exercise to your students today. |
        | 4 · Minor edits | Wording or formatting only | You clarify a sentence or add the expected output format to the problem statement. |
        | 3 · Moderate edits | Local changes; the design stays | You add failure messages to a few tests, rename a misleading stub, or fix one rule and its test. |
        | 2 · Major revision | Parts must be redesigned | The template already solves the core concept, or half of the tasks have no tests. |
        | 1 · Discard | Writing it from scratch is faster | The exercise targets a different topic or level. |

        Rate your own effort as an instructor; the other questions cover the effort of students.

background:
  title: About you
  intro: >-
    Before the exercises, a few questions about your background. We use them to describe the group of
    raters and to interpret differences between ratings.
  items:
    - id: B1
      kind: choice
      layout: list
      prompt: Your current role
      options:
        - { value: professor, label: Professor or lecturer }
        - { value: postdoc, label: Postdoc }
        - { value: phd, label: PhD student or teaching assistant }
        - { value: tutor, label: Student tutor }
        - { value: other, label: Other, detail: { label: Your role } }
    - id: B2
      kind: choice
      prompt: Years of experience in teaching or tutoring programming at a university
      options:
        - { value: under_1, label: Less than 1 }
        - { value: 1_to_2, label: 1 to 2 }
        - { value: 3_to_5, label: 3 to 5 }
        - { value: 6_to_10, label: 6 to 10 }
        - { value: over_10, label: More than 10 }
    - id: B3
      kind: multi
      prompt: Programming courses you have taught or tutored
      options:
        - { value: introductory, label: Introductory programming (first year) }
        - { value: advanced, label: "Advanced programming, or algorithms and data structures" }
        - { value: software_engineering, label: Software engineering }
        - { value: none, label: None so far, exclusive: true }
        - { value: other, label: Other, detail: { label: Which course } }
    - id: B4
      kind: choice
      prompt: Programming exercises you have created or substantially revised
      options:
        - { value: none, label: None }
        - { value: 1_to_5, label: 1 to 5 }
        - { value: 6_to_20, label: 6 to 20 }
        - { value: over_20, label: More than 20 }
    - id: B5
      kind: choice
      prompt: >-
        Have exercises you created or revised been assessed automatically, for example by unit tests
        that check each submission?
      options:
        - { value: "yes", label: "Yes" }
        - { value: "no", label: "No" }
    - id: B6
      kind: choice
      layout: list
      prompt: Your experience with Java, the language of the exercises
      options:
        - { value: none, label: None, description: I have not written Java. }
        - { value: basic, label: Basic, description: I can read and write small programs. }
        - {
            value: advanced,
            label: Advanced,
            description: I write larger programs and use the standard library confidently.,
          }
        - { value: professional, label: Professional, description: I use Java in my daily work. }
    - id: B7
      kind: choice
      prompt: How often do you use AI tools to create teaching material?
      options:
        - { value: never, label: Never }
        - { value: tried, label: Tried once or twice }
        - { value: occasionally, label: Occasionally }
        - { value: regularly, label: Regularly }
    - id: B8
      kind: choice
      layout: scale
      prompt: >-
        How much do you agree with this statement? “AI-generated exercises can, in principle, be
        suitable for teaching.”
      scale: { low: strongly disagree, high: strongly agree }
      options:
        [
          { value: 1, label: "1" },
          { value: 2, label: "2" },
          { value: 3, label: "3" },
          { value: 4, label: "4" },
          { value: 5, label: "5" },
        ]

questionnaire:
  title: Rating
  perspective: >-
    Answer as an instructor who decides whether to give this exercise to the students of an
    introductory programming course.
  parts:
    - id: A
      title: Problem statement
      minutes: 5
      opens: Read the problem statement and the brief it was generated from.
      material: [statement, brief]
      items:
        - id: CL1
          kind: choice
          dimension: Clarity
          prompt: Is every required behaviour stated so that only one reasonable reading exists?
          look_for: >-
            a rule two competent students would implement differently ("sort the items" without key
            or direction, an inclusive or exclusive bound); an example whose result does not follow
            from the stated rule.
          options: &yes-no-where-a
            - { value: "yes", label: "Yes" }
            - value: "no"
              label: "No"
              detail: { label: Where, hint: "A task or a sentence is enough." }
        - id: CL2
          kind: choice
          dimension: Clarity
          prompt: Is the problem statement easy to understand for an introductory programming student?
          look_for: >-
            undefined jargon; requirements buried in the narrative; a problem statement much longer
            or denser than the exercise warrants.
          options: *yes-no-where-a
    - id: B
      title: Template and solution changes
      minutes: 7
      opens: >-
        Skim the template students start from: which files they get, which stubs they complete, and
        what the comments say. The solution changes show what students add or change; you do not
        need to check them line by line.
      material: [template, diff]
      items:
        - id: SO1
          kind: choice
          dimension: Solvability
          prompt: >-
            Do the problem statement and the template tell students everything they need to produce
            the expected results, without seeing the tests?
          look_for: >-
            an edge case mentioned without its expected result; an output that must match exactly
            (message text, number format, ordering) but is not given verbatim.
          options: &yes-no-where-b
            - { value: "yes", label: "Yes" }
            - value: "no"
              label: "No"
              detail: { label: Where, hint: "A task, a sentence, or a file is enough." }
        - id: OA1
          kind: choice
          dimension: Fit with the brief
          prompt: Does the exercise practise the concept or learning objective named in the brief?
          options: *yes-no-where-b
        - id: OA2
          kind: choice
          dimension: Fit with the brief
          prompt: Must students actually apply the target concept to solve the exercise?
          look_for: >-
            the concept is already implemented in the template; a plain approach solves the exercise
            equally well and the problem statement does not rule it out (a recursion exercise
            solvable with a simple loop).
          options:
            - { value: "yes", label: "Yes" }
            - value: "no"
              label: "No"
              detail: { label: Where, hint: "A task, a sentence, or a file is enough." }
            - { value: na, label: "N/A, the brief names no specific concept" }
        - id: OA3
          kind: choice
          dimension: Fit with the brief
          prompt: Does the exercise honour the explicit requirements of the brief?
          look_for: >-
            a requested diagram, edge case, determinism constraint, given type, or prerequisite that
            the exercise ignores or exceeds.
          options:
            - { value: "yes", label: "Yes" }
            - { value: "no", label: "No", detail: { label: Unmet requirement } }
        - id: OA4
          kind: choice
          dimension: Fit with the brief
          prompt: Is the scenario sensible and motivating for the exercise?
          look_for: >-
            a context bolted onto an unrelated computation; contrived rules presented as realistic;
            wrong domain facts; a scenario that excludes or stereotypes groups of students.
          options: *yes-no-where-b
        - id: DF1
          kind: choice
          dimension: Scope
          prompt: >-
            Is the scope right: enough work to practise the concept, and at most 60 minutes for a
            student at this point in the course?
          note: Judge from the brief and the solution changes.
          options:
            - { value: "yes", label: "Yes" }
            - value: "no"
              label: "No"
              detail:
                label: Details
                required: false
                choices:
                  - { value: too_small, label: Too little to practise the concept }
                  - { value: too_large, label: More than 60 minutes of work }
        - id: SC1
          kind: choice
          dimension: Scaffolding
          prompt: >-
            Does the template give the right amount of support, so that the students' effort goes to
            the target concept?
          look_for: >-
            students must write boilerplate the exercise does not aim to teach (visible in the
            solution changes); so much is given that little remains; stubs whose purpose is unclear.
          options: *yes-no-where-b
        - id: SC2
          kind: choice
          dimension: Scaffolding
          prompt: >-
            Do the tasks of the problem statement form useful steps, so that students see their
            partial progress?
          look_for: >-
            one task for a multi-part exercise; a task that cannot be attempted before a later one;
            task titles that do not say what to do.
          options: *yes-no-where-b
        - id: OAB
          kind: text
          prompt: Other pedagogical issues in Parts A and B
          required: false
    - id: C
      title: Tests
      minutes: 3
      opens: >-
        Read each task's tests and the message a student sees when one fails. Where possible, the
        message comes from a wrong variant of the sample solution, as a student's mistake would
        produce it; otherwise it is the message on the template. Test code is not shown.
      material: [tests]
      items:
        - id: FB1
          kind: choice
          dimension: Feedback
          prompt: >-
            Would a student who fails a test learn from its name and message what is wrong, without
            being handed the solution?
          look_for: >-
            a test whose name and message together do not say what is wrong (`test1` failing with only
            "expected: <3> but was: <0>"); messages that spell out the code to write.
          options:
            - { value: "yes", label: "Yes" }
            - value: "no"
              label: "No"
              detail: { label: Where, hint: "A test name is enough." }
        - id: RD1
          kind: choice
          dimension: Readiness
          layout: list
          prompt: >-
            How much work would it take you before you could use this exercise in an introductory
            programming course?
          options: &readiness
            - { value: 5, label: Use as is, description: No change needed. }
            - {
                value: 4,
                label: Minor edits,
                description: Wording or formatting only; code and tests stay unchanged.,
              }
            - {
                value: 3,
                label: Moderate edits,
                description: "Local changes to the problem statement, the template, or a few tests; the design stays.",
              }
            - {
                value: 2,
                label: Major revision,
                description: "Parts of the problem statement, the template, or the tests must be redesigned.",
              }
            - {
                value: 1,
                label: Discard,
                description: Writing the exercise from scratch would be faster.,
              }
    - id: D
      title: Automatic findings
      minutes: 3
      opens: >-
        Read the automatic findings about this exercise. Answer this part's questions with them in
        mind; if they change your view of an earlier answer, note it under *Remarks on earlier
        answers*.
      material: [findings]
      items:
        - id: AF1
          kind: choice
          dimension: Automatic findings
          prompt: Do the automatic findings reveal a material problem that you had not noticed in Parts A to C?
          note: Count a problem only if it is material by the materiality rule.
          options:
            - { value: "yes", label: "Yes", detail: { label: Which } }
            - { value: "no", label: "No" }
            - { value: na, label: "N/A, the Findings tab lists no findings" }
        - id: AF2
          kind: choice
          dimension: Automatic findings
          prompt: Is every automatic finding correct and relevant for this exercise?
          options:
            - { value: "yes", label: "Yes" }
            - { value: "no", label: "No", detail: { label: Which finding and why } }
            - { value: na, label: "N/A, the Findings tab lists no findings" }
        - id: RD2
          kind: choice
          dimension: Readiness
          layout: list
          prompt: >-
            After reading the automatic findings: how much work would it take you before you could use
            this exercise in an introductory programming course?
          note: The same scale as in Part C; you may choose the same level again.
          options: *readiness
        - id: CHG
          kind: text
          prompt: The single most important change you would make to this exercise
          hint: "Optional if you chose 5 · Use as is."
          required: true
          optional_when: { item: RD2, value: 5 }
        - id: REM
          kind: text
          prompt: Remarks on earlier answers
          hint: Anything that later material made you see differently.
          required: false

exit:
  title: Looking back
  minutes: 4
  intro: >-
    You have rated all your exercises. These questions look back on all of them; a short page on the
    briefs follows.
  items:
    - id: X1
      kind: choice
      layout: scale
      prompt: How confident are you in your ratings overall?
      scale: { low: not confident, high: very confident }
      options:
        [
          { value: 1, label: "1" },
          { value: 2, label: "2" },
          { value: 3, label: "3" },
          { value: 4, label: "4" },
          { value: 5, label: "5" },
        ]
    - id: X2
      kind: choice
      prompt: Was the material enough to judge the exercises' pedagogical quality?
      options:
        - { value: "yes", label: "Yes" }
        - { value: "no", label: "No", detail: { label: Missing material } }
    - id: X3
      kind: choice
      prompt: Were any questions unclear or hard to answer?
      options:
        - { value: "no", label: "No" }
        - { value: "yes", label: "Yes", detail: { label: Which questions and why } }
    - id: X4
      kind: choice
      layout: scale
      prompt: >-
        Compared with the programming exercises you have written or used in your own teaching, the
        exercises you rated were overall:
      scale: { low: much worse, high: much better }
      options:
        - { value: 1, label: "1" }
        - { value: 2, label: "2" }
        - { value: 3, label: "3" }
        - { value: 4, label: "4" }
        - { value: 5, label: "5" }
        - { value: cannot_judge, label: Cannot judge }
    - id: X5
      kind: choice
      layout: scale
      prompt: How useful were the automatic findings for deciding whether to use an exercise?
      scale: { low: not useful, high: very useful }
      options:
        [
          { value: 1, label: "1" },
          { value: 2, label: "2" },
          { value: 3, label: "3" },
          { value: 4, label: "4" },
          { value: 5, label: "5" },
        ]
    - id: X6
      kind: choice
      prompt: Would you use such an AI pipeline to create exercises for your own course?
      options:
        - { value: "no", label: "No" }
        - { value: starting_point, label: Only as a starting point for my own exercise }
        - { value: with_review, label: "Yes, with a review like the one in this study" }
        - { value: little_review, label: "Yes, with little review" }
    - id: X7
      kind: choice
      layout: scale
      prompt: How demanding was this study for you?
      scale: { low: very low, high: very high }
      options:
        [
          { value: 1, label: "1" },
          { value: 2, label: "2" },
          { value: 3, label: "3" },
          { value: 4, label: "4" },
          { value: 5, label: "5" },
        ]
    - id: X8
      kind: text
      prompt: Further comments
      required: false

# The last step: the briefs of the study's exercises, which the exercises were generated from.
# Raters see only the briefs of their assigned exercises.
briefs:
  title: The briefs
  minutes: 10
  intro: >-
    These are the briefs for the exercises you rated, with matching numbers. Please review them
    and tell us whether they specify suitable exercises for an introductory programming course.
    Your comments help us improve the briefs.
  items:
    - id: BR1
      kind: choice
      prompt: >-
        Are the briefs clear and specific enough that an instructor would get the exercise they have
        in mind?
      options:
        - { value: "yes", label: "Yes" }
        - { value: "no", label: "No", detail: { label: Which briefs and why } }
    - id: BR2
      kind: choice
      prompt: Do the topics and stated prerequisites fit an introductory programming course?
      options:
        - { value: "yes", label: "Yes" }
        - { value: "no", label: "No", detail: { label: What does not fit } }
    - id: BR3
      kind: text
      prompt: Comments on individual briefs
      hint: Name the brief, such as “Brief 3”.
      required: false
