# The survey and its database behind the shared Traefik of the host, which terminates TLS. The
# deployment workflow writes .env next to this file; see example.env and README.md.
name: exgen-survey

services:
  survey:
    image: ghcr.io/ls1intum/exgen-bench/survey:${IMAGE_TAG:?set IMAGE_TAG}
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/survey
      SPRING_DATASOURCE_USERNAME: survey
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      SURVEY_PUBLIC_URL: https://${SURVEY_HOST:?set SURVEY_HOST}
      SURVEY_LEGAL_IMPRINT: ${SURVEY_LEGAL_IMPRINT:?set SURVEY_LEGAL_IMPRINT}
      SURVEY_LEGAL_PRIVACY: ${SURVEY_LEGAL_PRIVACY:?set SURVEY_LEGAL_PRIVACY}
      SURVEY_LEGAL_ACCESSIBILITY: ${SURVEY_LEGAL_ACCESSIBILITY:-}
    volumes:
      # The built study from the data repository, at the commit the study team froze.
      - ${STUDY_DIRECTORY:-./study}:/study:ro
      # Legal documents the survey shows itself, referred to as /legal/<file>.md.
      - ${LEGAL_DIRECTORY:-./legal}:/legal:ro
    networks: [traefik, internal]
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik
      - traefik.http.routers.exgen-survey.rule=Host(`${SURVEY_HOST}`)
      - traefik.http.routers.exgen-survey.entrypoints=websecure
      - traefik.http.routers.exgen-survey.tls.certresolver=harica
      - traefik.http.routers.exgen-survey.middlewares=exgen-survey-ratelimit
      # Generous for people, who autosave a draft every few seconds at most; tight for a script.
      - traefik.http.middlewares.exgen-survey-ratelimit.ratelimit.average=20
      - traefik.http.middlewares.exgen-survey-ratelimit.ratelimit.burst=60
      - traefik.http.services.exgen-survey.loadbalancer.server.port=8080
    # The JVM sizes its heap from this limit; a host that runs other services keeps the rest.
    mem_limit: 1g
    pids_limit: 512
    logging: &logging
      driver: json-file
      options: { max-size: 10m, max-file: "5" }

  db:
    image: postgres:18.6-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    environment:
      POSTGRES_DB: survey
      POSTGRES_USER: survey
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      # The answers. Back them up daily with pg_dump (README.md).
      - survey-data:/var/lib/postgresql
    networks: [internal]
    healthcheck:
      # Over TCP: during its first start, the image answers on the socket before it accepts the survey.
      test: ["CMD-SHELL", "pg_isready --host=127.0.0.1 --username=survey --dbname=survey"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 512m
    pids_limit: 256
    logging: *logging

networks:
  # Created by the host's Traefik deployment.
  traefik:
    external: true
  # The database is reachable from the survey only, and reaches nothing itself.
  internal:
    internal: true

volumes:
  survey-data:
