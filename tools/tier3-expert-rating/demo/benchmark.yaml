    name: Deterministic demo generator
    version: "1"
    revision: source-tree
    runtime:
      type: command
      command: ["{bun}", "run", "./generator.ts"]
    factors:
      approach: fixture
      model: none
      provider: fixture
    parameters: {}
    attestation:
      deployment_deviations: []
trials:
  replicates: 1
  base_seed: 20261026
analysis:
  method: case_clustered_bootstrap
  estimand: end_to_end_within_budget_strict_success_rate
  bootstrap_seed: 20261026
  bootstrap_resamples: 500
  confidence_level: 0.95
  contrasts: []
execution:
  results_dir: ../../../.exgen/runs
  concurrency: 2
  max_log_bytes: 1048576
