schema_version: "2"
id: expert-rating-demo
title: Expert rating survey demo
dataset: ./dataset.yaml
target:
  id: artemis-java-maven
  version: "1"
  revision: protocol-fixture-v1
  parameters:
    language: java
    build_system: maven
budget:
  wall_time_ms: 120000
  max_model_calls: 10
  max_tool_calls: 10
  max_input_tokens: 100000
  max_output_tokens: 100000
  max_total_tokens: 200000
  max_cost:
    amount: 1
    currency: USD
systems:
