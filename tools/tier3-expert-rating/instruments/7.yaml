# Main study questionnaire. V5 and V6 remain available for historical sessions.
schema_version: "1"
version: "7"
title: Expert study on generated programming exercises
allows_unverified_drafts: true
materiality_rule: >-
  Flag problems that could change what students write, affect their grade, or waste their time.
  Include wording or layout that could confuse students. Skip minor typos.
rating_example: |-
  A temperature exercise needs three different kinds of repair:

  - **Editorial fix:** Split a long sentence so the existing instructions are easier to follow.
  - **Local fix:** Specify the missing target unit, or fix one test that rejects a correct conversion.
  - **Major revision:** Rewrite the tests across the exercise because they check only that the code runs.
onboarding:
  title: Introduction
  pages:
    - title: How the review works
      body: |
        Start with the **Problem statement** and **Starter code** that students see. Then read
        the **Prompt**, which is what the instructor asked the AI to make, and look at one sample
        solution. Make your first decision after reading the tests. Then read the automatic check
        results and decide again.

        Once you submit a part, its answers are final. Earlier material stays available within
        the exercise.

        **Which problems count?** {materiality_rule}

        {rating_example}
background:
  title: About you
  intro: These answers help us describe who reviewed the exercises.
  items:
    - id: B1
      kind: choice
      layout: list
      prompt: Which best describes your current role?
      options:
        - { value: professor, label: Professor or lecturer }
        - { value: postdoc, label: Postdoc }
        - { value: phd, label: PhD student or teaching assistant }
        - { value: tutor, label: Student tutor }
        - { value: other, label: Other, detail: { label: Your role } }
    - id: B2
      kind: choice
      prompt: How many full years have you taught or tutored programming at a university?
      options:
        - { value: under_1, label: Less than 1 }
        - { value: 1_to_2, label: 1 to 2 }
        - { value: 3_to_5, label: 3 to 5 }
        - { value: 6_to_10, label: 6 to 10 }
        - { value: over_10, label: More than 10 }
    - id: B6
      kind: choice
      layout: list
      prompt: Which best describes your experience with Java?
      options:
        - { value: none, label: None, description: I have not written Java. }
        - { value: basic, label: Basic, description: I can read and write small programs. }
        - {
            value: advanced,
            label: Advanced,
            description: I write larger programs and use the standard library confidently.,
          }
        - { value: professional, label: Professional, description: I use Java in my daily work. }
    - id: B9
      kind: choice
      prompt: Have you used automated tests to grade programming exercises?
      options:
        - { value: "yes", label: "Yes" }
        - { value: "no", label: "No" }
questionnaire:
  title: Rating
  perspective: Decide whether the exercise is ready to give to students in an introductory Java course.
  parts:
    - id: A
      title: "Student instructions"
      minutes: 7
      opens: "Read the problem statement and skim the starter code. Keep in mind how far students are in the course and what the task says they already know."
      material: [statement, template]
      items:
        - id: SPEC
          kind: choice
          dimension: "Clarity"
          layout: list
          prompt: "Can students tell what their code needs to do?"
          note: "Judge how much students would struggle to work out what to do. A short clarification can still add a requirement."
          options:
            - value: "clear"
              label: "Clear enough"
              description: "The inputs, expected results and rules are clear."
            - value: "clarify"
              label: "Needs clarification"
              description: "A small edit would make it clear what students need to do."
              detail:
                {
                  "label": "Where’s the issue?",
                  "hint": "A task, file, method or test name is enough.",
                  "required": false,
                  "choices":
                    [
                      { "value": "unclear", "label": "Unclear rule" },
                      { "value": "missing", "label": "Missing requirement" },
                      { "value": "conflicting", "label": "Conflicting instructions" },
                      { "value": "hard_to_follow", "label": "Hard to follow" },
                    ],
                }
            - value: "rewrite"
              label: "Needs rewriting"
              description: "The task needs more than a small edit before students can tell what to do."
              detail:
                {
                  "label": "Where’s the issue?",
                  "hint": "A task, file, method or test name is enough.",
                  "required": false,
                  "choices":
                    [
                      { "value": "unclear", "label": "Unclear rule" },
                      { "value": "missing", "label": "Missing requirement" },
                      { "value": "conflicting", "label": "Conflicting instructions" },
                      { "value": "hard_to_follow", "label": "Hard to follow" },
                    ],
                }
            - value: "cannot_assess"
              label: "Cannot assess"
              description: "The text or files you need to judge the task are unavailable."
              detail: { "label": "What’s missing?" }
    - id: B
      title: "Teaching fit"
      minutes: 8
      opens: "Read the Prompt for the learning goal and what students already know. Use Solution changes to see one way to complete the task."
      material: [brief, diff]
      items:
        - id: GOAL
          kind: choice
          dimension: "Learning goal"
          layout: list
          prompt: "Does the exercise give students practice with the skill named in the Prompt?"
          note: "Consider any solution that follows the task instructions."
          options:
            - value: "central"
              label: "It’s central to the task"
              description: "Students need the skill to do the main work."
            - value: "limited"
              label: "Limited practice"
              description: "The task offers some practice, but only briefly or as an option."
              detail:
                {
                  "label": "Where’s the issue?",
                  "hint": "A task, file, method or test name is enough.",
                  "required": false,
                }
            - value: "none"
              label: "No practice"
              description: "The task gives students no meaningful opportunity to use the skill."
              detail:
                {
                  "label": "Where’s the issue?",
                  "hint": "A task, file, method or test name is enough.",
                  "required": false,
                }
            - value: "cannot_assess"
              label: "Cannot assess"
              description: "The Prompt doesn’t say what skill students should practise."
              detail: { "label": "What’s missing?" }
        - id: SCOPE
          kind: choice
          dimension: "Workload"
          layout: list
          prompt: "Is the workload right for these students?"
          note: "Use the time and prior knowledge given in the Prompt. If there’s no time estimate, use the course stage if you can. Include setup time."
          options:
            - value: "too_little"
              label: "Too little"
              detail:
                {
                  "label": "Where’s the issue?",
                  "hint": "A task, file, method or test name is enough.",
                  "required": false,
                }
            - value: "fits"
              label: "About right"
            - value: "too_much"
              label: "Too much"
              detail:
                {
                  "label": "Where’s the issue?",
                  "hint": "A task, file, method or test name is enough.",
                  "required": false,
                }
            - value: "cannot_assess"
              label: "Cannot assess"
              description: "The level or expected time is too unclear to judge."
              detail: { "label": "What’s missing?" }
        - id: SUPPORT
          kind: choice
          dimension: "Starter support"
          layout: list
          prompt: "Do the starter code and task steps give students enough help while leaving them the work they need to practise?"
          note: "Consider what students must figure out on their own and what the materials do for them."
          options:
            - value: "appropriate"
              label: "About right"
              description: "Students get enough help and still do the work they are meant to practise."
            - value: "change"
              label: "Needs a change"
              description: "Students lack help they need, or the starter code does work they should practise."
              detail:
                {
                  "label": "Where’s the issue?",
                  "hint": "A task, file, method or test name is enough.",
                  "required": false,
                  "choices":
                    [
                      { "value": "too_little", "label": "Too little support" },
                      { "value": "too_much", "label": "Too much support" },
                      { "value": "both", "label": "Both problems" },
                    ],
                }
            - value: "cannot_assess"
              label: "Cannot assess"
              description: "The relevant starter code or task steps are unavailable."
              detail: { "label": "What’s missing?" }
    - id: C
      title: "Tests and readiness"
      minutes: 5
      opens: "Read the test names and any messages. Then decide whether the exercise is ready to give to students."
      material: [tests]
      items:
        - id: FIT
          kind: choice
          dimension: "Prompt requirements"
          layout: list
          prompt: "Does the exercise follow the specific instructions in the Prompt?"
          note: "Look for requirements such as allowed libraries or what the program must output. Choose No if you find any clear mismatch, even if you can’t check other requirements."
          options:
            - value: "yes"
              label: "Yes"
              description: "You can check the requirements, and the exercise meets them."
            - value: "no"
              label: "No"
              description: "You found at least one requirement the exercise doesn’t meet."
              detail: { "label": "Which requirement, and where does the exercise break it?" }
            - value: "na"
              label: "No requirements beyond the goal"
              description: "The prompt gives a learning goal but no other concrete requirement."
            - value: "cannot_assess"
              label: "Cannot assess"
              description: "You can’t check a requirement from the material available."
              detail: { "label": "What’s missing?" }
        - id: FEEDBACK
          kind: choice
          dimension: "Test feedback"
          layout: list
          prompt: "Would the test names and messages help students find their mistakes?"
          note: >-
            A clear test name can help even when there’s no message. If tests check student work but you can’t see an example of a relevant failure, choose Cannot assess.
          options:
            - value: "useful"
              label: "Useful"
              description: "The feedback points to the mistake and leaves the fix to the student."
            - value: "change"
              label: "Needs a change"
              description: "A test gives too little help, points students in the wrong direction, or gives away the fix."
              detail:
                {
                  "label": "Where’s the issue?",
                  "hint": "A task, file, method or test name is enough.",
                  "required": false,
                }
            - value: "na"
              label: "No tests of student work"
            - value: "cannot_assess"
              label: "Cannot assess"
              description: "You can’t see a relevant example of test feedback."
              detail: { "label": "What’s missing?" }
        - id: RD1
          kind: choice
          dimension: "Readiness"
          layout: list
          prompt: "What, if anything, would you change before giving this exercise to students?"
          note: >-
            Decide from the material you’ve seen. A test passing on starter code is a clue to
            inspect. Test names and messages may leave grading questions open.
          options: &readiness
            - value: 5
              label: "Ready as is"
              description: "You’d assign it without changes."
            - value: 4
              label: "Editorial fix"
              description: "Change only the wording or layout of the student instructions. The requirements, code and tests stay the same."
              detail: { "label": "What’s the main change, and where?", "hint": "One short line." }
            - value: 3
              label: "Local fix"
              description: "Fix a requirement, code or tests within the existing tasks. The tasks and most of the grading can stay as they are."
              detail: { "label": "What’s the main change, and where?", "hint": "One short line." }
            - value: 2
              label: "Major revision"
              description: "Redesign a task or rebuild a substantial part of the grading. Several smaller fixes can add up to a major revision."
              detail: { "label": "What’s the main change, and where?", "hint": "One short line." }
            - value: 1
              label: "Replace"
              description: "Writing a new exercise would take less work."
              detail: { "label": "What’s the main change, and where?", "hint": "One short line." }
            - value: "cannot_assess"
              label: "Cannot assess"
              description: "You need more material to decide what changes are needed."
              detail: { "label": "What’s missing?" }
    - id: D
      title: "Automatic findings"
      minutes: 4
      opens: "Read the automatic check results. Decide again what you’d change before assigning the exercise."
      material: [findings]
      items:
        - id: RD2
          kind: choice
          dimension: "Readiness"
          layout: list
          prompt: "What, if anything, would you change before giving this exercise to students?"
          note: >-
            Use all the material you’ve seen. Check automatic findings against the task before
            counting them as problems. A test that gives the wrong grade needs a fix.
          options: *readiness
        - id: GRADE
          kind: choice
          dimension: "Grading errors"
          layout: list
          prompt: "Does the material show a case where the tests grade a solution incorrectly?"
          note: >-
            Compare what a solution does with what the task requires and how the tests score it.
            Missing coverage, a passing starter test or a failing sample solution alone can
            suggest a problem. Look for a specific example, such as tests giving credit after
            a code change that breaks a requirement.
          options:
            - value: no_case
              label: "No clear case in the material"
              description: "You could inspect the available evidence. It doesn’t show a specific wrong grade."
            - value: accepts_wrong
              label: "Gives credit for incorrect work"
              detail:
                &grading_example {
                  "label": "Which case shows the wrong grade?",
                  "hint": "Name the task or result and explain what should have happened.",
                }
            - value: rejects_correct
              label: "Deducts credit for correct work"
              detail: *grading_example
            - value: both
              label: "Shows both kinds of error"
              detail:
                {
                  "label": "Which cases show each error?",
                  "hint": "A short example of each is enough.",
                }
            - value: cannot_assess
              label: "Cannot assess"
              description: "There are no tests of student work, or their results are missing or unusable."
              detail: { "label": "What’s missing?" }
        - id: FIND
          kind: choice
          dimension: "Use of findings"
          layout: list
          prompt: "What did the automatic checks add to your decision?"
          note: >-
            Choose the first option that applies. A measurement can count as evidence.
          options:
            - value: "changed"
              label: "Changed what I’d fix"
              description: "You added or dropped a fix, or changed what you’d fix first."
              detail:
                {
                  "label": "Which result helped?",
                  "hint": "A finding ID or measurement name is enough.",
                }
            - value: "confirmed"
              label: "Backed up my decision"
              description: "The checks gave you useful evidence for keeping your earlier decision, even if you’d planned no changes."
              detail:
                {
                  "label": "Which result helped?",
                  "hint": "A finding ID or measurement name is enough.",
                }
            - value: "no_effect"
              label: "Added nothing to my decision"
              description: "You could review the report. It provided no evidence you used in your decision."
            - value: "na"
              label: "The report is empty"
              description: "There are no findings or measurements in the report."
            - value: "cannot_assess"
              label: "Cannot assess"
              description: "The report or the check results you need are unavailable."
              detail: { "label": "What’s missing?" }
        - id: FLAG
          kind: text
          prompt: Did any finding give the wrong impression?
          hint: If so, name the finding or measurement and explain why.
          required: false

exit:
  title: Looking back
  minutes: 2
  intro: This last question is optional.
  items:
    - id: X8
      kind: text
      prompt: Was anything hard to find or judge during the review?
      required: false
# An empty closing section is omitted by the survey. Older instruments still ask these questions.
briefs:
  title: The briefs
  minutes: 1
  intro: Feedback on the prompts.
  items: []
